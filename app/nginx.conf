server {
    listen 80;
    server_name cambridgevillagehoa.com www.cambridgevillagehoa.com;
    root /var/www/html;
    index index.html;

    # Serve pre-built Angular SPA; fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the .NET backend on Azure App Service (^~ beats the static-asset regex below)
    location ^~ /api/ {
        proxy_pass https://cambridgehoa-f2guazhzfdg8d5f5.centralus-01.azurewebsites.net;
        proxy_set_header Host cambridgehoa-f2guazhzfdg8d5f5.centralus-01.azurewebsites.net;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve uploaded files (PDFs, images) from the .NET backend on Azure
    location ^~ /uploads/ {
        proxy_pass https://cambridgehoa-f2guazhzfdg8d5f5.centralus-01.azurewebsites.net;
        proxy_set_header Host cambridgehoa-f2guazhzfdg8d5f5.centralus-01.azurewebsites.net;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf|docx)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
