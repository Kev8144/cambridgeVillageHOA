<header id="header">
  <h1 id="logo"><a routerLink="/{{ lang }}">Community</a></h1>
  <nav id="nav">
    <ul>
      <li><a routerLink="/{{ lang }}" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">{{ "nav.home" | translate }}</a></li>
      <li><a routerLink="/{{ lang }}/newsletters"    routerLinkActive="active">{{ "nav.newsletters"     | translate }}</a></li>
      <li><a routerLink="/{{ lang }}/documents"      routerLinkActive="active">{{ "nav.documents"       | translate }}</a></li>
      <li><a routerLink="/{{ lang }}/faq"            routerLinkActive="active">{{ "nav.faq"             | translate }}</a></li>
      <li><a routerLink="/{{ lang }}/meet-the-board" routerLinkActive="active">{{ "nav.meet_the_board"  | translate }}</a></li>
      <li>
        <span class="lang-switcher">
          <button [class.active]="lang === 'en'" (click)="switchLang('en')">EN</button>
          <span>|</span>
          <button [class.active]="lang === 'es'" (click)="switchLang('es')">ES</button>
        </span>
      </li>
    </ul>
  </nav>
</header>
