<div id="main">
  <div class="container auth-form">
    <h2>{{ 'auth.forgot_title' | translate }}</h2>
    @if (sent()) {
      <p class="auth-message">{{ 'auth.forgot_sent' | translate }}</p>
      <p class="auth-link"><a [routerLink]="['/', lang, 'login']">{{ 'auth.back_to_login' | translate }}</a></p>
    } @else {
      <p style="text-align:center;margin-bottom:1.25rem;">{{ 'auth.forgot_description' | translate }}</p>
      <form (submit)="submit($event)" novalidate>
        <div class="field">
          <input type="email" [placeholder]="'auth.email' | translate" [value]="email()" (input)="email.set($any($event.target).value)" autocomplete="email" />
        </div>
        <div class="actions">
          <button type="submit" class="button" [disabled]="loading()">{{ 'auth.forgot_btn' | translate }}</button>
        </div>
        <p class="auth-link"><a [routerLink]="['/', lang, 'login']">{{ 'auth.back_to_login' | translate }}</a></p>
      </form>
    }
  </div>
</div>
