<div id="main">
  <div class="container">
    <div class="page-header">
      <h2>{{ 'pages.meet_the_board_title' | translate }}</h2>
      <p>{{ 'pages.meet_the_board_description' | translate }}</p>
    </div>
    @for (member of members(); track member.role) {
      <div class="board-member">
        <img [src]="member.photo" [alt]="member.name" loading="lazy" />
        <div>
          <h2>{{ member.role }}</h2>
          <h4>{{ member.name }}</h4>
          <p>Contact Email: <a [href]="'mailto:' + member.email">{{ member.email }}</a></p>
        </div>
      </div>
    }
  </div>
</div>
