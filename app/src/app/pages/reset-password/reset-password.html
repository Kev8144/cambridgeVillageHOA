<div id="main">
  <div class="container auth-form">
    <h2>{{ (isInvite ? 'auth.set_password_title' : 'auth.reset_title') | translate }}</h2>
    @if (success()) {
      <p class="auth-message">{{ 'auth.reset_success' | translate }}</p>
      <p class="auth-link"><a [routerLink]="['/', lang, 'login']">{{ 'auth.back_to_login' | translate }}</a></p>
    } @else {
      <form (submit)="submit($event)" novalidate>
        @if (error()) {
          <p class="form-error">{{ error() | translate }}</p>
        }
        <div class="field">
          <input type="password" [placeholder]="'auth.new_password' | translate" [value]="password()" (input)="password.set($any($event.target).value)" autocomplete="new-password" />
        </div>
        <div class="field">
          <input type="password" [placeholder]="'auth.confirm_password' | translate" [value]="confirm()" (input)="confirm.set($any($event.target).value)" autocomplete="new-password" />
        </div>
        <div class="actions">
          <button type="submit" class="button" [disabled]="loading()">{{ 'auth.reset_btn' | translate }}</button>
        </div>
      </form>
    }
  </div>
</div>
